{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card shadow border-primary mt-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">🗄️ Admin Panel: Registered Data Hashes</h4>
                <a href="{{ url_for('logout') }}" class="btn btn-sm btn-light">Logout</a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Data Name / File Name</th>
                                <th>Hash (SHA3-256)</th>
                                <th>Date Added</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for h in hashes %}
                            <tr>
                                <td>{{ h.id }}</td>
                                <td class="fw-bold">{{ h.data_name }}</td>
                                <td><code class="text-muted" style="word-break: break-all;">{{ h.hash_value }}</code></td>
                                <td>{{ h.date_added }}</td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="4" class="text-center py-4">No registered data found.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
